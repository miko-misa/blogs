name: Render blogs to portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-blogs-main
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout blogs
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Test renderer
        run: python3 -m unittest scripts/test_render_site.py

      - name: Download typmark-cli
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import shutil
          import subprocess
          import tarfile
          import urllib.request

          release_tag = "v0.5.1"
          url = (
            "https://github.com/miko-misa/typmark/releases/download/"
            f"{release_tag}/typmark-cli-{release_tag}-"
            "x86_64-unknown-linux-gnu.tar.gz"
          )
          expected_digest = (
            "sha256:0a673a8e1d08f8b93b12a6a6037b212f"
            "a7c4d3120a8c0ee87e0607e4f7bdc657"
          )

          archive_path = "typmark-cli.tar.gz"
          urllib.request.urlretrieve(url, archive_path)
          with open(archive_path, "rb") as archive:
            actual_digest = "sha256:" + hashlib.file_digest(
              archive, "sha256"
            ).hexdigest()
          if actual_digest != expected_digest:
            raise SystemExit("typmark-cli release digest mismatch")

          extract_dir = "typmark-cli-bin"
          os.makedirs(extract_dir, exist_ok=True)
          with tarfile.open(archive_path, "r:gz") as tar:
            tar.extractall(extract_dir, filter="data")

          binary_path = None
          for root, _, files in os.walk(extract_dir):
            if "typmark-cli" in files:
              binary_path = os.path.join(root, "typmark-cli")
              break

          if not binary_path:
            raise SystemExit("typmark-cli binary not found in archive")

          shutil.copy2(binary_path, "./typmark-cli")
          os.chmod("./typmark-cli", 0o755)

          version = subprocess.check_output(
            ["./typmark-cli", "--version"], text=True
          ).strip()
          if release_tag != f"v{version}":
            raise SystemExit(
              f"Pinned release {release_tag} contains CLI version {version}"
            )
          print(f"Using TypMark {release_tag}")
          PY

      - name: Install Typst figure dependencies
        env:
          TYPMARK_TYPST_PACKAGE_PATHS: ${{ runner.temp }}/typst-packages
          TYPMARK_FONT_PATHS: ${{ runner.temp }}/typst-fonts/NotoSansJP.ttf
        run: |
          set -euo pipefail

          install_package() {
            name=$1
            version=$2
            checksum=$3
            archive="$RUNNER_TEMP/$name-$version.tar.gz"
            destination="$TYPMARK_TYPST_PACKAGE_PATHS/preview/$name/$version"

            curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              --location \
              "https://packages.typst.org/preview/$name-$version.tar.gz" \
              --output "$archive"
            echo "$checksum  $archive" | sha256sum --check
            mkdir -p "$destination"
            tar --extract --gzip --file "$archive" --directory "$destination"
          }

          install_package cetz 0.3.2 \
            6f26915b0629aa659139ed7884a7821497481ea9b64e03db05e8bbb742838f16
          install_package cetz 0.3.4 \
            4f4b5a8d311d519e749940a766fe50521e40c041129e1c91af0c42e61f307514
          install_package cetz-plot 0.1.1 \
            f057107e2c4bbfc92e2494054a22c90e146a22e0136ee04f68a7728347685d75
          install_package fletcher 0.5.7 \
            e1db0e39ccf7680005f166bda40ed6bd9dbcc1ee4ec465cf68238e11c0bc6994
          install_package oxifmt 0.2.1 \
            16fac2923032c59727de01e84d42cac45e8790da28df56effca49f4de41b09d9

          font_repo=https://raw.githubusercontent.com/google/fonts
          font_commit=352f6b7d9d6cc4fa9e242b931291d31b21a6dc84
          font_file=ofl/notosansjp/NotoSansJP%5Bwght%5D.ttf
          font_checksum=c2f3b4d463500a2ddcd3849cded1fceeb9fd6d1c32e6cbecd568453ba50fc68f

          mkdir -p "$(dirname "$TYPMARK_FONT_PATHS")"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --location "$font_repo/$font_commit/$font_file" \
            --output "$TYPMARK_FONT_PATHS"
          echo "$font_checksum  $TYPMARK_FONT_PATHS" | sha256sum --check

          echo "TYPMARK_TYPST_PACKAGE_PATHS=$TYPMARK_TYPST_PACKAGE_PATHS" \
            >> "$GITHUB_ENV"
          echo "TYPMARK_FONT_PATHS=$TYPMARK_FONT_PATHS" >> "$GITHUB_ENV"

      - name: Render .tmd to HTML
        run: python3 scripts/render_site.py

      - name: Checkout portfolio
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: miko-misa/portfolio
          token: ${{ secrets.PORTFOLIO_PUSH_TOKEN }}
          persist-credentials: false
          path: portfolio

      - name: Publish to portfolio
        env:
          PORTFOLIO_PUSH_TOKEN: ${{ secrets.PORTFOLIO_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf portfolio/public/blogs
          rm -rf portfolio/public/blogs-content
          rm -rf portfolio/public/blogs/assets

          mkdir -p portfolio/public/blogs-content portfolio/public/blogs/assets
          rsync -a site/blogs-content/ portfolio/public/blogs-content/
          rsync -a site/blogs/assets/ portfolio/public/blogs/assets/
          cp site/blogs-index.json portfolio/public/blogs-index.json

          cd portfolio
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/blogs-content \
            public/blogs/assets \
            public/blogs-index.json
          git commit -m "Update blogs from blogs@${GITHUB_SHA::7}"
          auth=$(printf 'x-access-token:%s' "$PORTFOLIO_PUSH_TOKEN" \
            | base64 | tr -d '\n')
          git -c \
            "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin HEAD:main
